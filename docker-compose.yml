# Local demo environment. Credentials below are development-only defaults.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: newtonite
      POSTGRES_DB: newtonite
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment: &app-env
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://newtonite:newtonite@db:5432/newtonite
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
      CORS_ORIGIN: http://localhost:5173
    command: sh -c "npm run db:migrate && npm run db:seed -- --if-empty && node server/src/server.js"
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 40

  worker:
    build: .
    environment: *app-env
    command: node server/src/workers/index.js
    depends_on:
      api: { condition: service_healthy }

  client:
    build: .
    environment:
      VITE_API_PROXY: http://api:3000
    command: npm run dev -w client -- --host 0.0.0.0
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_healthy }

  tests:
    build: .
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgres://newtonite:newtonite@db:5432/newtonite_test
    command: npm run test:all
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
